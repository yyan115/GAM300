name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
      release_name:
        description: 'Release name (e.g. Milestone 4 - Final Submission)'
        required: true
      changelog:
        description: 'Changelog / release notes (supports markdown)'
        required: false
        type: string
      skip_publish:
        description: 'Build everything but do not create a release'
        required: false
        default: false
        type: boolean

env:
  VCPKG_COMMIT: 2d6a6cf3ac9a7cc93942c3d289a2f9c661a6f4a7

jobs:
  # ── Windows Installer Build ────────────────────────────────────────
  windows-build:
    runs-on: windows-2022
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Cache vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: vcpkg
        key: vcpkg-exe-${{ env.VCPKG_COMMIT }}

    - name: Cache vcpkg packages
      id: cache-vcpkg-packages
      uses: actions/cache@v4
      with:
        path: Project/Build/vcpkg_installed
        key: vcpkg-pkgs-${{ env.VCPKG_COMMIT }}-${{ hashFiles('Project/vcpkg.json') }}

    - name: Bootstrap vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        git checkout ${{ env.VCPKG_COMMIT }}
        .\bootstrap-vcpkg.bat -disableMetrics
      shell: pwsh

    - name: Install dependencies
      if: steps.cache-vcpkg-packages.outputs.cache-hit != 'true'
      run: cmake --preset release
      working-directory: Project

    - name: Configure CMake
      # -DGAME_CONSOLE=OFF is the only difference between this and a local
      # Release build. It sets the linker subsystem to WINDOWS so the shipped
      # game has no console window; Release keeps its console everywhere else,
      # because that is the build people debug with.
      run: cmake --preset release -DGAME_CONSOLE=OFF
      working-directory: Project

    - name: Build
      run: cmake --build --preset release --parallel
      working-directory: Project

    - name: Build AssetCooker
      # The game loads .dds and .mesh, which are build output: gitignored, and
      # absent from a clean checkout. Without this step the installer ships a
      # game that cannot load a texture, which is what every previous release
      # build produced. The cooker links the Editor-flavoured Engine because the
      # compile loop it drives is inside #ifdef EDITOR.
      run: |
        cmake --preset editor-release
        cmake --build --preset editor-release --target AssetCooker --parallel
      working-directory: Project

    - name: Verify authored materials survive cooking
      run: python Tools/test_material_cooking.py --cooker Build/EditorRelease/AssetCooker.exe
      working-directory: Project

    - name: Cook assets
      shell: pwsh
      # Run from the build directory: the .meta files store their source paths
      # relative to one, so the cooker resolves ../../Resources the same way the
      # editor does. It exits non-zero if it produced no .dds or .mesh.
      run: |
        $ErrorActionPreference = "Stop"
        Push-Location "Build\EditorRelease"
        if (-not (Test-Path ".\AssetCooker.exe")) {
            Write-Error "AssetCooker.exe was not built into $(Get-Location)"
            exit 1
        }
        .\AssetCooker.exe --resources ..\..\Resources
        $code = $LASTEXITCODE
        if ($code -ne 0) {
            # A missing runtime DLL kills the process before main() and prints
            # nothing, so a silent non-zero exit needs the directory listing to
            # be diagnosable at all.
            Write-Host "AssetCooker exited $code. Contents of $(Get-Location):"
            Get-ChildItem -Name | Sort-Object | ForEach-Object { Write-Host "  $_" }
            Write-Error "AssetCooker failed with exit code $code"
            exit 1
        }
        Pop-Location
      working-directory: Project

    - name: Verify the shipped exe has no console
      shell: pwsh
      # Checked rather than trusted. dumpbin reports the PE subsystem: a
      # console build says "3 subsystem (Windows CUI)" and a windowed one says
      # "2 subsystem (Windows GUI)". If -DGAME_CONSOLE=OFF ever stops taking
      # effect, this fails the release instead of shipping a console window.
      run: |
        $ErrorActionPreference = "Stop"
        $exe = "Project\Build\Release\Kusane.exe"
        if (-not (Test-Path $exe)) { Write-Error "$exe not found"; exit 1 }
        $headers = & dumpbin /headers $exe
        $line = $headers | Select-String -Pattern 'subsystem \(Windows' | Select-Object -First 1
        Write-Host "PE subsystem line: $line"
        if ($line -match 'Windows GUI') {
            Write-Host "OK: no console window."
        } elseif ($line -match 'Windows CUI') {
            Write-Error "Kusane.exe is a console app; -DGAME_CONSOLE=OFF did not take effect."
            exit 1
        } else {
            Write-Error "Could not read the PE subsystem from dumpbin output."
            exit 1
        }

    - name: Prepare and test packaging tools
      run: |
        python -m pip install soundfile==0.13.1
        python -m unittest discover -s Project/Tools -p "test_*.py"

    - name: Stage game files for installer
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $gamedir = "Installer\GAMEDIRECTORY"
        New-Item -ItemType Directory -Force -Path $gamedir | Out-Null

        # Verify the game build exists
        if (-not (Test-Path "Project\Build\Release\Kusane.exe")) {
            Write-Error "Kusane.exe not found in Project\Build\Release — build failed?"
            Get-ChildItem Project\Build\Release -ErrorAction SilentlyContinue | Format-Table -AutoSize
            exit 1
        }

        # Follow imports recursively so editor-only DLLs are not installed.
        $buildDir = "Project\Build\Release"
        $pending = [System.Collections.Generic.Queue[string]]::new()
        $copied = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
        $pending.Enqueue("Kusane.exe")
        while ($pending.Count -gt 0) {
            $name = $pending.Dequeue()
            if (-not $copied.Add($name)) { continue }
            $binary = Join-Path $buildDir $name
            Copy-Item -LiteralPath $binary -Destination $gamedir -Force
            $imports = & dumpbin /nologo /dependents $binary
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect dependencies of $name" }
            foreach ($line in $imports) {
                if ($line -notmatch '^\s+([^\s]+\.dll)\s*$') { continue }
                $dependency = $Matches[1]
                if ($dependency -match '^(MSVCP\d+D|VCRUNTIME\d+(?:_\d+)?D|ucrtbased)\.dll$') {
                    throw "Debug runtime dependency in ${name}: $dependency"
                }
                if (Test-Path -LiteralPath (Join-Path $buildDir $dependency)) {
                    $pending.Enqueue($dependency)
                } elseif ($dependency -match '^(api-ms-|ext-ms-)' -or
                          (Test-Path -LiteralPath (Join-Path "$env:WINDIR\System32" $dependency))) {
                    # Windows system APIs and the installed VC redistributable.
                    continue
                } else {
                    throw "Missing dependency of ${name}: $dependency"
                }
            }
        }

        # Keep cooked assets and metadata; validate every removed art source.
        python Project/Tools/stage_resources.py --resources Project/Resources --destination "$gamedir/Resources"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python Project/Tools/compress_audio.py --game-directory "$gamedir"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        # ProjectSettings holds TagsAndLayers.json. Without it the game falls back
        # to the eleven built-in tags, and the project defines 23: Throwables stop
        # being hookable, 47 NoCameraCollision objects stop fading and block the
        # camera, and lock-on, checkpoint and dialogue tags stop resolving. Enemy
        # and Boss are built in, so it still starts and looks fine at a glance.
        # The shortcuts set WorkingDir to {app}, so the game's fallback lookup of
        # <cwd>\ProjectSettings\TagsAndLayers.json finds it here.
        New-Item -ItemType Directory -Force -Path "$gamedir\ProjectSettings" | Out-Null
        Copy-Item -Path "Project\ProjectSettings\TagsAndLayers.json" -Destination "$gamedir\ProjectSettings" -Force

        # Verification — fail fast if something looks wrong so we catch it in CI, not in the wild.
        Write-Host "=== Staged top-level files ==="
        Get-ChildItem $gamedir -File | Select-Object Name, @{N='Size(KB)';E={[int]($_.Length/1KB)}} | Format-Table -AutoSize

        Write-Host "=== Resource subdirs ==="
        Get-ChildItem "$gamedir\Resources" -Directory | Select-Object Name | Format-Table -AutoSize

        $exeOk = Test-Path "$gamedir\Kusane.exe"
        $engineOk = Test-Path "$gamedir\Engine.dll"
        $fmodOk = Test-Path "$gamedir\fmod.dll"
        $resOk = Test-Path "$gamedir\Resources\Scenes"
        $shaderOk = Test-Path "$gamedir\Resources\Shaders"
        $modelOk = Test-Path "$gamedir\Resources\Models"
        $configOk = Test-Path "$gamedir\Resources\Configs\input_config.json"
        $tagsOk = Test-Path "$gamedir\ProjectSettings\TagsAndLayers.json"

        Write-Host "Kusane.exe:                 $exeOk"
        Write-Host "Engine.dll:                 $engineOk"
        Write-Host "fmod.dll:                   $fmodOk"
        Write-Host "Resources\Scenes:           $resOk"
        Write-Host "Resources\Shaders:          $shaderOk"
        Write-Host "Resources\Models:           $modelOk"
        Write-Host "Resources\Configs\...json:  $configOk"
        Write-Host "ProjectSettings\Tags...json: $tagsOk"

        if (-not ($exeOk -and $engineOk -and $fmodOk -and $resOk -and $shaderOk -and $modelOk -and $configOk -and $tagsOk)) {
            Write-Error "Staging is missing required files — installer would produce a broken game."
            exit 1
        }

        # .dds, .mesh and .font are gitignored, so a clean checkout has none and
        # the Cook assets step above is what produces them. Desktop has no
        # raw-image fallback, that path being ANDROID-only, so shipping without
        # these gives a game that renders untextured. Counting them here is the
        # check that the cook actually landed where staging reads from.
        $ddsCount  = (Get-ChildItem "$gamedir\Resources" -Recurse -File -Filter *.dds  -ErrorAction SilentlyContinue).Count
        $meshCount = (Get-ChildItem "$gamedir\Resources" -Recurse -File -Filter *.mesh -ErrorAction SilentlyContinue).Count
        $fontCount = (Get-ChildItem "$gamedir\Resources" -Recurse -File -Filter *.font -ErrorAction SilentlyContinue).Count
        Write-Host "=== Compiled assets staged ==="
        Write-Host "  .dds  textures: $ddsCount"
        Write-Host "  .mesh models:   $meshCount"
        Write-Host "  .font fonts:    $fontCount"

        if ($ddsCount -eq 0 -or $meshCount -eq 0 -or $fontCount -eq 0) {
            Write-Error "No compiled assets staged (.dds=$ddsCount, .mesh=$meshCount). The Cook assets step should have produced these, so it either failed or staged from the wrong place."
            exit 1
        }

        $totalMb = [int](((Get-ChildItem $gamedir -Recurse -File | Measure-Object -Property Length -Sum).Sum) / 1MB)
        Write-Host "=== Total staged size: $totalMb MB ==="

    - name: Check the bundled runtime is not older than the compiler
      # The staged payload carries no VCRUNTIME140.dll or MSVCP140.dll, so the
      # game takes its C++ runtime from whatever the redistributable installs.
      # Microsoft's runtime is backward compatible and not forward compatible,
      # so a binary built by a newer toolset can ask an older runtime for entry
      # points it does not export, and the game fails to start on a clean
      # machine with no hint as to why. The two were 14.44 and 14.36.
      #
      # The compiler reports 19.MM, which is toolset 14.MM, so its own output
      # answers the question without searching the filesystem for a runtime DLL.
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $redist = Get-Item "Installer\REDIST\VC_redist.x64.exe"
        $redistVersion = [version]$redist.VersionInfo.ProductVersion
        Write-Host "bundled redistributable: $redistVersion"

        $banner = (& cl 2>&1 | Out-String)
        if ($banner -notmatch "Version\s+(\d+)\.(\d+)\.") {
            Write-Host "could not read the compiler version, skipping the comparison"
            Write-Host $banner
            exit 0
        }
        $toolset = [version]"$([int]$Matches[1] - 5).$($Matches[2])"
        Write-Host "compiler reports:        $($Matches[1]).$($Matches[2]), toolset $toolset"

        if ($redistVersion.Major -ne $toolset.Major) {
            throw "Redistributable major version $redistVersion does not match toolset $toolset."
        }
        if ($redistVersion.Minor -lt $toolset.Minor) {
            throw "Bundled redistributable $redistVersion is older than toolset $toolset. Refresh Installer\REDIST\VC_redist.x64.exe from https://aka.ms/vs/17/release/vc_redist.x64.exe"
        }
        Write-Host "The bundled runtime is new enough for the compiler that built the game."

    - name: Install Inno Setup
      run: choco install innosetup -y --no-progress
      shell: cmd

    - name: Build installer
      env:
        GAME_RELEASE_VERSION: ${{ github.event.inputs.version }}
      run: |
        $ErrorActionPreference = "Stop"
        $version = $env:GAME_RELEASE_VERSION -replace '^[vV](?=\d)', ''
        if (Test-Path "Installer\INSTALLER") {
            Remove-Item "Installer\INSTALLER" -Recurse -Force
        }
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DGameVersion=$version" "Installer\InstallScript.iss"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      shell: pwsh

    - name: Verify single-file installer
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $setup = Get-Item "Installer\INSTALLER\Kusane_Setup.exe"
        $files = @(Get-ChildItem "Installer\INSTALLER" -File -Recurse)
        if ($files.Count -ne 1 -or $files[0].FullName -ne $setup.FullName) {
            throw "Windows release must contain only Kusane_Setup.exe."
        }
        $setup | Select-Object Name, Length | Format-Table -AutoSize
        if ($setup.Length -eq 0 -or $setup.Length -ge 2GB) {
            throw "Kusane_Setup.exe must be non-empty and below GitHub's 2 GiB release-asset limit."
        }

    - name: Test installation from the single executable
      shell: pwsh
      timeout-minutes: 10
      run: |
        $ErrorActionPreference = "Stop"
        $downloadDir = Join-Path $env:RUNNER_TEMP "kusane-download"
        $installDir = Join-Path $env:RUNNER_TEMP "Kusane Install Test"
        $installLog = Join-Path $env:RUNNER_TEMP "kusane-install.log"
        New-Item -ItemType Directory -Path $downloadDir | Out-Null
        Copy-Item "Installer\INSTALLER\Kusane_Setup.exe" $downloadDir
        $setup = Join-Path $downloadDir "Kusane_Setup.exe"
        $uninstaller = Join-Path $installDir "unins000.exe"

        # The Gallery's Complete Uninstall requirement is "all files and all
        # shortcuts of any kind", so these are the three places to look after.
        $startMenuGroup = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\DigiPen\Kusane"
        $desktopShortcut = Join-Path $env:PUBLIC "Desktop\Kusane.lnk"

        try {
            $arguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-",
                           "/DIR=`"$installDir`"", "/LOG=`"$installLog`"")
            $process = Start-Process -FilePath $setup -ArgumentList $arguments -WorkingDirectory $downloadDir -Wait -PassThru
            if ($process.ExitCode -ne 0) {
                throw "Installer failed with exit code $($process.ExitCode)."
            }

            $sourceDir = (Resolve-Path "Installer\GAMEDIRECTORY").Path
            $sourceFiles = @(Get-ChildItem $sourceDir -File -Recurse)
            foreach ($source in $sourceFiles) {
                $relative = [System.IO.Path]::GetRelativePath($sourceDir, $source.FullName)
                $installed = Join-Path $installDir $relative
                if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
                    throw "Installation is missing $relative"
                }
                if ((Get-FileHash -LiteralPath $source.FullName).Hash -ne (Get-FileHash -LiteralPath $installed).Hash) {
                    throw "Installed file does not match the packaged file: $relative"
                }
            }
            if (-not (Test-Path -LiteralPath $uninstaller)) {
                throw "Installation did not create an uninstaller."
            }
            Write-Host "Verified all $($sourceFiles.Count) installed files from Kusane_Setup.exe alone."

            # Shortcuts have to exist before their removal can mean anything.
            foreach ($shortcut in @((Join-Path $startMenuGroup "Kusane.lnk"), $desktopShortcut)) {
                if (-not (Test-Path -LiteralPath $shortcut)) {
                    throw "Installation did not create the shortcut $shortcut"
                }
            }
            Write-Host "Verified the start menu and desktop shortcuts exist."
        } catch {
            if (Test-Path -LiteralPath $installLog) { Get-Content $installLog -Tail 80 }
            throw
        }

        # ── Complete Uninstall ────────────────────────────────────────────
        # unins000.exe copies itself into TEMP and relaunches so it can delete
        # its own executable, which means the process we started returns long
        # before the work is finished. Waiting on it proves nothing, so poll
        # for the install directory to actually disappear.
        $process = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
        if ($process.ExitCode -ne 0) {
            throw "Uninstaller failed with exit code $($process.ExitCode)."
        }
        $deadline = (Get-Date).AddMinutes(2)
        while ((Test-Path -LiteralPath $installDir) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
        }

        $leftovers = @()
        if (Test-Path -LiteralPath $installDir) {
            $remaining = @(Get-ChildItem -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue)
            $leftovers += "install directory still exists with $($remaining.Count) entries"
            $remaining | Select-Object -First 20 | ForEach-Object { Write-Host "  left behind: $($_.FullName)" }
        }
        if (Test-Path -LiteralPath $startMenuGroup) {
            $leftovers += "start menu group $startMenuGroup still exists"
        }
        if (Test-Path -LiteralPath $desktopShortcut) {
            $leftovers += "desktop shortcut $desktopShortcut still exists"
        }
        if ($leftovers.Count -gt 0) {
            throw "Uninstall was not complete: $($leftovers -join '; ')"
        }
        Write-Host "Verified uninstall removed the install directory and every shortcut."

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: Installer/INSTALLER/Kusane_Setup.exe
        if-no-files-found: error
        retention-days: 1

  # ── Android APK Build ──────────────────────────────────────────────
  linux-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Linux build dependencies
      # The X11 and GLU development packages GLFW needs, matching the list
      # .linuxscripts/setup-vcpkg.sh checks for on a developer machine.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ninja-build pkg-config binutils \
          libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev \
          libxext-dev libxrender-dev libxfixes-dev libxxf86vm-dev \
          libgl1-mesa-dev libglu1-mesa-dev

    - name: Cache vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: vcpkg
        key: vcpkg-linux-exe-${{ env.VCPKG_COMMIT }}

    - name: Cache vcpkg packages
      id: cache-vcpkg-packages
      uses: actions/cache@v4
      with:
        path: Project/Build/vcpkg_installed
        key: vcpkg-linux-pkgs-${{ env.VCPKG_COMMIT }}-${{ hashFiles('Project/vcpkg.json') }}

    - name: Bootstrap vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        git checkout ${{ env.VCPKG_COMMIT }}
        ./bootstrap-vcpkg.sh -disableMetrics

    - name: Configure and build the game
      run: |
        cmake --preset linux-release
        cmake --build --preset linux-release --parallel
      working-directory: Project

    - name: Build AssetCooker
      # Same reason as the Windows job: the game loads .dds and .mesh, which
      # are build output, gitignored, and absent from a clean checkout. Without
      # this the package ships a game that cannot load a texture.
      run: |
        cmake --preset linux-editor-release
        cmake --build --preset linux-editor-release --target AssetCooker --parallel
      working-directory: Project

    - name: Verify authored materials survive cooking
      run: python3 Tools/test_material_cooking.py --cooker Build/LinuxEditorRelease/AssetCooker
      working-directory: Project

    - name: Cook assets
      # Run from the build directory: the .meta files store their source paths
      # relative to one, so the cooker resolves ../../Resources the same way
      # the editor does.
      run: |
        set -euo pipefail
        cd Build/LinuxEditorRelease
        test -x ./AssetCooker || { echo "AssetCooker was not built here"; ls -la; exit 1; }
        ./AssetCooker --resources ../../Resources
      working-directory: Project

    - name: Install packaging dependencies
      # soundfile recompresses the shipped audio, Pillow converts the installer
      # icon. Without either the build still succeeds, just larger or iconless,
      # so they are installed rather than left to chance.
      run: python3 -m pip install --break-system-packages soundfile==0.13.1 Pillow

    - name: Build the AppImage
      run: Project/Tools/build_appimage.sh

    - name: Verify the AppImage
      # A single file that is executable, has the AppImage magic bytes, and is
      # large enough to contain the game. A truncated or empty output has
      # shipped from a packaging step before.
      run: |
        set -euo pipefail
        IMG=Project/Build/appimage/Kusane-x86_64.AppImage
        test -x "$IMG" || { echo "not executable or missing"; exit 1; }
        size=$(stat -c%s "$IMG")
        echo "AppImage is $((size / 1048576)) MiB"
        test "$size" -gt 209715200 || { echo "under 200 MiB, the payload is missing"; exit 1; }
        python3 -c "import sys;d=open(sys.argv[1],'rb').read(16);assert d[:4]==b'\x7fELF', d[:4].hex();assert d[8:11]==bytes([0x41,0x49,0x02]), d[8:11].hex();print('ELF with AppImage type 2 magic')" "$IMG"

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-release
        path: Project/Build/appimage/Kusane-x86_64.AppImage

  android-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Cache Jolt Physics (FetchContent)
      uses: actions/cache@v4
      with:
        path: Project/Build/android-release/_deps
        key: android-deps-Release-${{ hashFiles('Project/ImportDependencies.cmake') }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK and Ninja
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14033849"
        sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Build APK
      run: ./gradlew assembleRelease
      working-directory: AndroidProject

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-release
        path: AndroidProject/app/build/outputs/apk/release/*.apk
        retention-days: 1

  # ── Create GitHub Release ──────────────────────────────────────────
  publish-release:
    needs: [windows-build, linux-build, android-build]
    # Lets a branch prove the three builds without cutting a release that every
    # teammate sees. Packaging faults have reached the artifact while the job
    # itself stayed green, so the build has to be runnable on its own.
    if: ${{ inputs.skip_publish != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-release
        path: release-files/

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: linux-release
        path: release-files/

    - name: Download Android artifact
      uses: actions/download-artifact@v4
      with:
        name: android-release
        path: release-files/

    - name: Rename APK
      # Android install fails when the APK filename contains hyphens/version suffix on some
      # devices (package installer refuses to read the manifest). Strip everything to `Kusane.apk`.
      run: |
        cd release-files
        for f in *.apk; do
          mv "$f" "Kusane.apk"
        done

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        target_commitish: ${{ github.sha }}
        name: ${{ github.event.inputs.release_name }}
        body: |
          ## ${{ github.event.inputs.release_name }}

          **Version:** `${{ github.event.inputs.version }}`

          ${{ github.event.inputs.changelog }}

          ### Downloads
          - **Windows** — download and run `Kusane_Setup.exe`.
          - **Linux** — download `Kusane-x86_64.AppImage`, then `chmod +x` it and run it.
          - **Android** — `Kusane.apk`

          ---
